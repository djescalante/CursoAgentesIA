AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Curso AWS Local con floci - VPC de 2 zonas de disponibilidad, 2 servidores web
  (Windows Server en AWS real / Linux en floci), 2 bases de datos RDS y un
  Application Load Balancer. Desplegado con CloudFormation.

Parameters:
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: Bloque CIDR de la VPC
  Az1:
    Type: String
    Default: us-east-1a
    Description: Primera zona de disponibilidad
  Az2:
    Type: String
    Default: us-east-1b
    Description: Segunda zona de disponibilidad
  InstanceType:
    Type: String
    Default: t3.micro
  AmiId:
    Type: String
    Default: ami-0c02fb55956c7d316
    Description: AMI (en AWS real se usa una AMI de Windows Server 2022)
  DbPassword:
    Type: String
    Default: ChangeMe123!
    NoEcho: true

Resources:
  # ---------------------------------------------------------------- Red
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: curso-vpc-cfn

  PubSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Ref Az1
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: curso-pub-1

  PubSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Ref Az2
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: curso-pub-2

  PrivSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Ref Az1
      Tags:
        - Key: Name
          Value: curso-priv-1

  PrivSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.12.0/24
      AvailabilityZone: !Ref Az2
      Tags:
        - Key: Name
          Value: curso-priv-2

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: curso-igw-cfn

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: curso-rt-public

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PubSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PubSubnet1
      RouteTableId: !Ref PublicRouteTable

  PubSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PubSubnet2
      RouteTableId: !Ref PublicRouteTable

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SG de los servidores web del curso
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 3389
          ToPort: 3389
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SG del Application Load Balancer
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  # ---------------------------------------------------------------- Servidores
  WebServer1:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref AmiId
      SubnetId: !Ref PubSubnet1
      SecurityGroupIds:
        - !Ref WebSecurityGroup
      UserData: |
        #!/bin/bash
        dnf install -y nginx >/var/log/bootstrap.log 2>&1
        echo "<h1>SERVIDOR A - AZ us-east-1a (CloudFormation)</h1>" > /usr/share/nginx/html/index.html
        systemctl enable nginx >/dev/null 2>&1
        systemctl start nginx >>/var/log/bootstrap.log 2>&1 || nginx >>/var/log/bootstrap.log 2>&1
      Tags:
        - Key: Name
          Value: curso-web-1

  WebServer2:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref AmiId
      SubnetId: !Ref PubSubnet2
      SecurityGroupIds:
        - !Ref WebSecurityGroup
      UserData: |
        #!/bin/bash
        dnf install -y nginx >/var/log/bootstrap.log 2>&1
        echo "<h1>SERVIDOR B - AZ us-east-1b (CloudFormation)</h1>" > /usr/share/nginx/html/index.html
        systemctl enable nginx >/dev/null 2>&1
        systemctl start nginx >>/var/log/bootstrap.log 2>&1 || nginx >>/var/log/bootstrap.log 2>&1
      Tags:
        - Key: Name
          Value: curso-web-2

  # ---------------------------------------------------------------- Bases de datos
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subredes privadas de bases de datos (2 AZ)
      SubnetIds:
        - !Ref PrivSubnet1
        - !Ref PrivSubnet2

  DBPedidos:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: db-pedidos-cfn
      DBInstanceClass: db.t3.micro
      Engine: postgres
      MasterUsername: admin
      MasterUserPassword: !Ref DbPassword
      AllocatedStorage: 20
      DBSubnetGroupName: !Ref DBSubnetGroup

  DBInventario:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: db-inventario-cfn
      DBInstanceClass: db.t3.micro
      Engine: mysql
      MasterUsername: admin
      MasterUserPassword: !Ref DbPassword
      AllocatedStorage: 20
      DBSubnetGroupName: !Ref DBSubnetGroup

  # ---------------------------------------------------------------- Load Balancer
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: curso-web-tg-cfn
      Protocol: HTTP
      Port: 80
      TargetType: instance
      VpcId: !Ref VPC

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: curso-alb-cfn
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PubSubnet1
        - !Ref PubSubnet2
      SecurityGroups:
        - !Ref AlbSecurityGroup

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

Outputs:
  VpcId:
    Value: !Ref VPC
  AlbDnsName:
    Value: !GetAtt LoadBalancer.DNSName
  WebServer1Id:
    Value: !Ref WebServer1
  WebServer2Id:
    Value: !Ref WebServer2

